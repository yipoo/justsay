name: Test certificate automation

on:
  push:
    paths: ['scripts/certificates/**', '.github/workflows/certificate*.yml']
  pull_request:
    paths: ['scripts/certificates/**', '.github/workflows/certificate*.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/certificates/requirements.txt
      - run: python -m unittest discover -s scripts/certificates -p 'test_*.py' -v
